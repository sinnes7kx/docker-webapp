
name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v6

      - name: Bygg Docker-image
        run: docker build -t min-webbapp:test .

      - name: Starta containern
        run: docker run -d --name test-webbapp -p 8080:80 min-webbapp:test

      - name: Testa webbsidan
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:8080/ | grep -Fq "Version 2!"; then
              echo "Test lyckades!"
              exit 0
            fi
            sleep 1
          done
          echo "Test misslyckades!"
          docker logs test-webbapp
          exit 1

  publish-image:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Hämta koden
        uses: actions/checkout@v6

      - name: Logga in på GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Bygg Docker-image
        run: |
          docker build -t ghcr.io/sinnes7kx/docker-webapp:latest .

      - name: Publicera Docker-image
        run: |
          docker push ghcr.io/sinnes7kx/docker-webapp:latest

